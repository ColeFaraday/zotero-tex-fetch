<vbox id="texfetch-prefs">
  <groupbox>
    <label><html:h2>arXiv LaTeX source</html:h2></label>
    <checkbox
      id="texfetch-auto-fetch"
      preference="extensions.zotero.texfetch.autoFetch"
      label="Fetch the arXiv LaTeX source automatically when items are added"
    />
    <description>
      Items synced from other devices are skipped. Use the item context menu to fetch them.
    </description>
  </groupbox>
</vbox>
